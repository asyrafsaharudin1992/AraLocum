<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AraLocum | Apple Calendar Edition</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-card: #FFFFFF;
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --ios-text: #000000;
            --ios-label: #8E8E93;
        }

        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--ios-bg); color: var(--ios-text); -webkit-font-smoothing: antialiased; }
        .nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 1000; padding: 15px 20px; border-bottom: 0.5px solid rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 500px; margin: 0 auto; padding: 15px; }

        /* Calendar Styles */
        .calendar-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 700; font-size: 18px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 5px; }
        .day-name { font-size: 10px; color: var(--ios-label); font-weight: 700; padding-bottom: 5px; cursor: pointer; }
        .day-name:hover { color: var(--ios-blue); }
        .date-cell { padding: 10px 0; border-radius: 50%; font-size: 14px; position: relative; cursor: pointer; transition: 0.2s; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; }
        .date-cell:hover { background: #E9E9EB; }
        .date-cell.today { background: var(--ios-red); color: white; }
        .date-cell.selected { background: var(--ios-blue); color: white; }
        .has-slot::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--ios-blue); border-radius: 50%; }
        .today.has-slot::after { background: white; }

        /* Form & Cards */
        .card { background: var(--ios-card); border-radius: 18px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 10px; background: #E9E9EB; font-size: 15px; box-sizing: border-box; }
        .btn { border: none; border-radius: 12px; padding: 14px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; }
        .btn-primary { background: var(--ios-blue); color: white; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .hidden { display: none; }
        .tab-menu { display: flex; background: #E9E9EB; padding: 4px; border-radius: 12px; margin-bottom: 15px; }
        .tab-menu button { flex: 1; border: none; padding: 8px; border-radius: 10px; background: transparent; font-weight: 600; font-size: 13px; }
        .tab-menu button.active { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="nav">
    <h2 id="page-title">AraLocum</h2>
    <button class="btn" style="width:auto; background:transparent; color:var(--ios-blue); padding:0" onclick="location.reload()">Reset</button>
</div>

<div class="container">
    <div id="view-auth">
        <h3 style="text-align:center">Welcome</h3>
        <div class="card">
            <input type="text" id="loginPhone" placeholder="Mobile Number">
            <button class="btn btn-primary" onclick="loginDoctor()">Sign In</button>
            <center><button class="btn" style="background:none; color:var(--ios-blue); font-size:13px; margin-top:10px" onclick="showView('register')">Register New Profile</button></center>
        </div>
        <p style="text-align:center; font-size:11px; color:var(--ios-label)" onclick="showView('admin')">Admin Console</p>
    </div>

    <div id="view-register" class="hidden">
        <h3>Registration</h3>
        <div class="card">
            <input type="text" id="regName" placeholder="Full Name">
            <input type="text" id="regPhone" placeholder="WhatsApp Number">
            <input type="text" id="regMMC" placeholder="MMC No.">
            <button class="btn btn-primary" onclick="registerDoctor()">Submit Application</button>
        </div>
    </div>

    <div id="view-doctor" class="hidden">
        <div class="tab-menu">
            <button id="btn-tab-cal" class="active" onclick="switchDrTab('dr-cal')">Calendar</button>
            <button id="btn-tab-pay" onclick="switchDrTab('dr-pay')">Earnings</button>
        </div>

        <div id="dr-cal">
            <div class="calendar-card">
                <div class="calendar-header" id="month-label">February 2026</div>
                <div class="calendar-grid" id="calendar-days">
                    <div class="day-name" onclick="filterByDay(0)">S</div>
                    <div class="day-name" onclick="filterByDay(1)">M</div>
                    <div class="day-name" onclick="filterByDay(2)">T</div>
                    <div class="day-name" onclick="filterByDay(3)">W</div>
                    <div class="day-name" onclick="filterByDay(4)">T</div>
                    <div class="day-name" onclick="filterByDay(5)">F</div>
                    <div class="day-name" onclick="filterByDay(6)">S</div>
                </div>
                <div class="calendar-grid" id="calendar-dates"></div>
            </div>
            
            <select id="clinic-filter" onchange="renderSlots()">
                <option value="All">All Clinics</option>
            </select>
            
            <div id="slot-display-list"></div>
        </div>

        <div id="dr-pay" class="hidden">
            <div id="earning-list"></div>
        </div>
    </div>

    <div id="view-admin" class="hidden">
        <div class="tab-menu">
            <button class="active" id="adm-tab-1" onclick="switchAdminTab('adm-slots')">Schedule</button>
            <button id="adm-tab-2" onclick="switchAdminTab('adm-verify')">Verify</button>
        </div>

        <div id="adm-slots">
            <div class="card">
                <span style="font-size:12px; color:var(--ios-label)">Tap a date on calendar to set date</span>
                <input type="text" id="admClinic" placeholder="Clinic Name">
                <input type="date" id="admDate">
                <input type="number" id="admPay" placeholder="Payment Amount RM">
                <button class="btn btn-primary" onclick="addSlot()">Publish Shift</button>
            </div>
            <div id="admin-calendar-root"></div> <div id="admin-master-list"></div>
        </div>

        <div id="adm-verify" class="hidden">
            <div id="pending-list"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, addDoc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBiIJjmUGmBgm3oQQXMf35DezOetI3_T1w", authDomain: "aralocum.firebaseapp.com", projectId: "aralocum", storageBucket: "aralocum.firebasestorage.app", messagingSenderId: "665619614983", appId: "1:665619614983:web:e3b4b50524c2730cf609a2" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    
    let currentDr = null;
    let allSlots = [];
    let selectedDate = null;
    let selectedDayIndex = null;

    // --- CALENDAR LOGIC ---
    function renderCalendar(targetId) {
        const root = document.getElementById(targetId);
        root.innerHTML = '';
        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) root.innerHTML += '<div></div>';
        
        for (let d = 1; d <= totalDays; d++) {
            const dateStr = `2026-02-${d.toString().padStart(2, '0')}`;
            const hasSlot = allSlots.some(s => s.date === dateStr && s.status === 'available');
            const isSelected = selectedDate === dateStr;
            
            const cell = document.createElement('div');
            cell.className = `date-cell ${hasSlot ? 'has-slot' : ''} ${isSelected ? 'selected' : ''}`;
            cell.innerText = d;
            cell.onclick = () => { 
                selectedDate = dateStr; 
                selectedDayIndex = null;
                if(currentDr === null) document.getElementById('admDate').value = dateStr;
                renderCalendar(targetId);
                renderSlots();
            };
            root.appendChild(cell);
        }
    }

    // --- CORE FUNCTIONS ---
    window.loginDoctor = async () => {
        const p = document.getElementById('loginPhone').value;
        const q = query(collection(db, "users"), where("phone", "==", p));
        const snap = await getDocs(q);
        if(snap.empty) return alert("Not found");
        const user = snap.docs[0].data();
        if(user.status !== 'verified') return alert("Pending verification");
        currentDr = user; showView('doctor');
    };

    window.addSlot = async () => {
        const clinic = document.getElementById('admClinic').value;
        const date = document.getElementById('admDate').value;
        const pay = document.getElementById('admPay').value;
        if(!clinic || !date) return alert("Fill all");
        await addDoc(collection(db, "slots"), { clinicName: clinic, date: date, payment: pay, status: 'available' });
        alert("Published");
    };

    window.filterByDay = (dayIndex) => {
        selectedDayIndex = dayIndex;
        selectedDate = null;
        renderSlots();
    };

    // --- REALTIME ---
    onSnapshot(query(collection(db, "slots"), orderBy("date", "asc")), (snap) => {
        allSlots = snap.docs.map(d => ({id: d.id, ...d.data()}));
        
        // Update Clinic Filter Options
        const filter = document.getElementById('clinic-filter');
        const clinics = [...new Set(allSlots.map(s => s.clinicName))];
        filter.innerHTML = '<option value="All">All Clinics</option>';
        clinics.forEach(c => filter.innerHTML += `<option value="${c}">${c}</option>`);

        renderCalendar('calendar-dates');
        renderSlots();
    });

    window.renderSlots = () => {
        const list = document.getElementById('slot-display-list');
        const clinicVal = document.getElementById('clinic-filter').value;
        list.innerHTML = '';

        let filtered = allSlots.filter(s => s.status === 'available');

        if(clinicVal !== 'All') filtered = filtered.filter(s => s.clinicName === clinicVal);
        if(selectedDate) filtered = filtered.filter(s => s.date === selectedDate);
        if(selectedDayIndex !== null) {
            filtered = filtered.filter(s => new Date(s.date).getDay() === selectedDayIndex);
        }

        filtered.forEach(s => {
            list.innerHTML += `<div class="card">
                <b>${s.clinicName}</b><br><small style="color:var(--ios-label)">${s.date}</small>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px">
                    <span>RM${s.payment}</span>
                    <button class="btn btn-primary" style="width:auto; padding:8px 15px" onclick="bookSlot('${s.id}')">Claim</button>
                </div>
            </div>`;
        });
    };

    window.bookSlot = async (id) => {
        await updateDoc(doc(db, "slots", id), { status: 'booked', bookedBy: currentDr.name, payStatus: 'Pending' });
        alert("Success");
    };

    // --- NAVIGATION ---
    window.showView = (v) => {
        if(v === 'admin' && prompt("Code?") !== 'admin123') return;
        document.getElementById('view-auth').classList.add('hidden');
        document.getElementById('view-register').classList.add('hidden');
        document.getElementById('view-doctor').classList.toggle('hidden', v !== 'doctor');
        document.getElementById('view-admin').classList.toggle('hidden', v !== 'admin');
        if(v === 'admin') renderCalendar('admin-calendar-root');
    };

    window.switchDrTab = (t) => {
        document.getElementById('dr-cal').classList.toggle('hidden', t !== 'dr-cal');
        document.getElementById('dr-pay').classList.toggle('hidden', t !== 'dr-pay');
        document.getElementById('btn-tab-cal').className = t==='dr-cal'?'active':'';
        document.getElementById('btn-tab-pay').className = t==='dr-pay'?'active':'';
    };
</script>
</body>
</html>
